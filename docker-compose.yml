services:
  backend:
    build:
      context: ./backend
    ports:
      - "2020:2020"
    environment:
      - NODE_ENV=production
      # Set this to the origin browsers use to reach the frontend,
      # e.g. https://chat.example.com (defaults to http://localhost:3000)
      - ALLOWED_ORIGINS=http://localhost:1010
      - PORT=2020
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2020/health', r => process.exit(r.statusCode!==200?1:0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    ports:
      - "1010:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/var/run/nginx.pid"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
