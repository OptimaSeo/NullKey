services:
  backend:
    build:
      context: ./backend
    ports:
      - "2020:8080"
    environment:
      - NODE_ENV=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - PORT=8080
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - RATE_LIMIT_MAX_CONNECTIONS_PER_IP=${RATE_LIMIT_MAX_CONNECTIONS_PER_IP:-20}
      - RATE_LIMIT_MESSAGES_PER_WINDOW=${RATE_LIMIT_MESSAGES_PER_WINDOW:-60}
      - RATE_LIMIT_MESSAGES_WINDOW_MS=${RATE_LIMIT_MESSAGES_WINDOW_MS:-60000}
      - MAX_PARTICIPANTS_PER_ROOM=${MAX_PARTICIPANTS_PER_ROOM:-10}
      - MAX_ROOM_LIFETIME_MINUTES=${MAX_ROOM_LIFETIME_MINUTES:-60}
      - ROOM_IDLE_TIMEOUT_MINUTES=${ROOM_IDLE_TIMEOUT_MINUTES:-10}
      - MESSAGE_TTL_MINUTES=${MESSAGE_TTL_MINUTES:-5}
      - MAX_MESSAGE_SIZE_BYTES=${MAX_MESSAGE_SIZE_BYTES:-1048576}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-104857600}
      - REPLAY_PROTECTION_ENABLED=${REPLAY_PROTECTION_ENABLED:-true}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED:-true}
      - DISCONNECT_ON_REPEATED_VIOLATIONS=${DISCONNECT_ON_REPEATED_VIOLATIONS:-true}
      - MAX_VIOLATIONS_BEFORE_DISCONNECT=${MAX_VIOLATIONS_BEFORE_DISCONNECT:-10}
      - CLEANUP_INTERVAL_MS=${CLEANUP_INTERVAL_MS:-60000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://backend:8080}
    ports:
      - "1010:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
